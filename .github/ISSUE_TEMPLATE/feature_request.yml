name: 功能建议
description: 提议新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案与取舍
  - type: checkboxes
    id: scope
    attributes:
      label: 合规确认
      options:
        - label: 该建议不包含批量爬取、账号窃取、绕过付费或 DRM 等能力
          required: true
