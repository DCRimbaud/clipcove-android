name: Feature request
description: Suggest a new capability or UX improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: scope
    attributes:
      label: Compliance confirmation
      options:
        - label: This request does not involve bulk scraping, account theft, paywall bypass, or DRM circumvention
          required: true
