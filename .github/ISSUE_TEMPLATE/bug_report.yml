name: Bug report
description: Report a parsing, download, UI, or build issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove cookies, xsec_token values, phone numbers, IP addresses, and copyrighted media before submitting. Report security issues through a private advisory.
  - type: input
    id: version
    attributes:
      label: ClipCove version
      placeholder: "1.0.2 (15)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device
      placeholder: "Android 14 / Pixel 6"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Douyin
        - Xiaohongshu
        - Downloads / general UI
        - Build / CI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Copy a share link
2. Open ClipCove
3. ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual result and error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Do not include full cookies, xsec_token values, or media files.
